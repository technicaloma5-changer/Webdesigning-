<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS ID Selector</title>

    <style>
        /* Styling a specific element using its ID */
        #main-heading {
            color: darkblue;
            text-align: center;
        }

        /* Adding some style to the introduction paragraph */
        #intro {
            color: #555;
            font-size: 18px;
            text-align: center;
        }

        /* Giving the message box a simple design */
        #message {
            background-color: lightyellow;
            border: 1px solid orange;
            padding: 15px;
            margin: 20px;
            text-align: center;
        }

        /* Styling the button using its ID */
        #learn-more {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Main heading of the page -->
    <h1 id="main-heading">CSS ID Selector</h1>

    <!-- A short introduction to the topic -->
    <p id="intro">
        An ID selector is used to style a specific HTML element.
        In CSS, we select an ID by placing a # symbol before its name.
    </p>

    <!-- This message has its own unique ID -->
    <div id="message">
        <p>
            I am learning how to style HTML elements using CSS ID selectors!
        </p>
    </div>

    <!-- A simple button to demonstrate ID-based styling -->
    <div style="text-align: center;">
        <button id="learn-more">Keep Learning</button>
    </div>

</body>
</html>
