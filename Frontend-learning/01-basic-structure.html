<!DOCTYPE html>
<html lang="en"> <!-- en show english language-->

<head>
    <!-- This section contains information about the webpage -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- that show or control size of screen-->

    <!-- Title shown on the browser tab -->
    <title>HTML Basics</title>
</head>

<body>

    <!-- Main heading of the webpage -->
    <h1>hello AI, i am coming!</h1>

    <!-- Paragraph tag that use for writing content on page-->
    <p>This is my first HTML file.</p>

</body>

</html>
