<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>Div Element</title>
</head>

<body>

    
    <h1>HTML Elements</h1>

    <!-- 13. Div Element -->
    <h2>13. Div Element</h2>

    <!-- The <div> tag is a block-level container -->
    <!-- It is commonly used to group related HTML elements -->

    <div>
        <h3>About HTML</h3>

        <p>
            HTML is used to create the structure of a webpage.
        </p>
    </div>

    <!-- Another div can be used to create a separate section -->
    <div>
        <h3>About CSS</h3>

        <p>
            CSS is used to style and design a webpage.
        </p>
    </div>

    <!-- Horizontal line used to separate sections -->
    <hr>

</body>

</html>
