<!DOCTYPE html>
<!-- This tells the browser that we are using HTML5 -->

<html lang="en">
<head>
    <!-- This is used to set the character encoding -->
    <meta charset="UTF-8">

    <!-- Title of the webpage -->
    <title>DOCTYPE Example</title>
</head>

<body>

    <!-- Main heading of the webpage -->
    <h1>DOCTYPE Example</h1>

    <!-- Paragraph explaining the DOCTYPE declaration -->
    <p>
        The &lt;!DOCTYPE html&gt; declaration tells the browser
        that this document uses HTML5.
    </p>

</body>
</html>
