<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Headers</title>
</head>
<body><h1>HTML Table Headers</h1>

<!--
    The <table> element is used to create a table.
    Each row is created using the <tr> element.
    We use <th> for headings and <td> for normal table data.
-->

<table border="1">

    <!-- This row contains the table headings -->
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>

    <!-- Student information -->
    <tr>
        <td>Rahul</td>
        <td>18</td>
        <td>Nagpur</td>
    </tr>

    <tr>
        <td>Aman</td>
        <td>19</td>
        <td>washim</td>
    </tr>

    <tr>
        <td>Priya</td>
        <td>18</td>
        <td>Amaravati</td>
    </tr>

</table>

</body>
</html>
