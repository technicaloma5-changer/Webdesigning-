<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Description List</title>
</head>
<body>

    <!-- Main heading of the page -->
    <h1>HTML Description List</h1>

    <!-- Description list starts here -->
    <dl>

        <!-- dt is used for the term or name -->
        <dt>HTML</dt>

        <!-- dd is used to describe the term -->
        <dd>HTML is used to create the structure of web pages.</dd>

        <dt>CSS</dt>
        <dd>CSS is used to style and design web pages.</dd>

        <dt>JavaScript</dt>
        <dd>JavaScript is used to add interactivity to web pages.</dd>

    </dl>

</body>
</html>
