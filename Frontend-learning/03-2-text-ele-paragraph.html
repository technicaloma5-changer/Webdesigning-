<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Elements - Paragraph</title>
</head>
<body>

    <!-- The paragraph element is used to display a block of text.
         It is written using the <p> tag. -->

    <!-- A simple paragraph -->
    <p>This is my first paragraph in HTML.</p>

    <!-- Another paragraph -->
    <p>
        HTML is used to create the structure of a webpage.
        Paragraphs help us organize and display text in a readable way.
    </p>

    <!-- Multiple paragraphs can be used to separate different ideas -->
    <p>
        I am learning HTML step by step and practicing different
        text elements to understand how webpages are structured.
    </p>

</body>
</html>
