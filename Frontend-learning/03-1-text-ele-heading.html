<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Elements - Headings</title>
</head>
<body>

    <!-- Headings are used to define titles and headings on a webpage.
         HTML provides six levels of headings, from h1 to h6. -->

    <!-- h1 is the main and most important heading -->
    <h1>This is Heading 1</h1>

    <!-- h2 is used for major sections under the main heading -->
    <h2>This is Heading 2</h2>

    <!-- h3 is used for subsections -->
    <h3>This is Heading 3</h3>

    <!-- h4 is used for smaller sections -->
    <h4>This is Heading 4</h4>

    <!-- h5 is used for less important headings -->
    <h5>This is Heading 5</h5>

    <!-- h6 is the smallest heading level -->
    <h6>This is Heading 6</h6>
<h1>this is size of text which used for specific purposes,but h1 show about your page </h1>
</body>
</html>
