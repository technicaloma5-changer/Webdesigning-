
   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Styling</title>
</head>

<body>

    <!-- Page heading -->
    <h1>Table Styling Example</h1>

    <!-- Creating a student details table -->
  <!--styles using following tags-->
  
    <table border="1" cellpadding="10" cellspacing="10">

        <!-- Table name -->
        <caption>Student Details</caption>

        <!-- Adding the table headings -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Class</th>
                <th>City</th>
            </tr>
        </thead>

        <!-- Adding student details -->
        <tbody>

            <!-- First student -->
            <tr>
                <td>Rahul</td>
                <td>16</td>
                <td>10th</td>
                <td>Nagpur</td>
            </tr>

            <!-- Second student -->
            <tr>
                <td>Priya</td>
                <td>15</td>
                <td>10th</td>
                <td>Mumbai</td>
            </tr>

            <!-- Third student -->
            <tr>
                <td>Aman</td>
                <td>17</td>
                <td>11th</td>
                <td>Pune</td>
            </tr>

            <!-- Fourth student -->
            <tr>
                <td>Neha</td>
                <td>16</td>
                <td>10th</td>
                <td>Delhi</td>
            </tr>

        </tbody>

    </table>

</body>
</html>
