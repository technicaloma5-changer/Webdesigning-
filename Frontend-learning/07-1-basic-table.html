<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Table</title>
</head>
<body>

    <h1>Basic HTML Table</h1>

  <!-- create Table by using following tag -->
  
<!-- border set the size of border of table content -->

<p>Hello World!</p>
    <table border="1">
        <tr>
     <!-- th for table header  -->       <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
<!-- tr for table row -->
        <tr>
       <!-- td for table data -->     <td>Rahul</td>
            <td>20</td>
            <td>Nagpur</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>21</td>
            <td>Mumbai</td>
        </tr>

        <tr>
            <td>Amit</td>
            <td>19</td>
            <td>Pune</td>
        </tr>
    </table>

</body>
</html>
