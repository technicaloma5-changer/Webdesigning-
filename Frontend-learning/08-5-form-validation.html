<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Validation</title>
</head>
<body>

    <h1>HTML Form Validation</h1>

    <p>
        This example demonstrates basic HTML5 form validation
        using required, minlength, maxlength, type, min, max,
        and pattern attributes.
    </p>

    <form action="#" method="post">

        <!-- Name -->
        <div>
            <label for="name">Full Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
                minlength="3"
            >
        </div>

        <br>

        <!-- Email -->
        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
            >
        </div>

        <br>

        <!-- Password -->
        <div>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                minlength="8"
            >
        </div>

        <br>

        <!-- Age -->
        <div>
            <label for="age">Age:</label>
            <input
                type="number"
                id="age"
                name="age"
                min="13"
                max="100"
                required
            >
        </div>

        <br>

        <!-- Phone -->
        <div>
            <label for="phone">Phone Number:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10-digit phone number"
                pattern="[0-9]{10}"
                title="Please enter a 10-digit phone number"
                required
            >
        </div>

        <br>

        <!-- Username -->
        <div>
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                minlength="4"
                maxlength="15"
                pattern="[A-Za-z0-9]+"
                title="Username can contain only letters and numbers"
                required
            >
        </div>

        <br>

        <!-- Website -->
        <div>
            <label for="website">Website:</label>
            <input
                type="url"
                id="website"
                name="website"
                placeholder="https://example.com"
            >
        </div>

        <br>

        <!-- Date -->
        <div>
            <label for="date">Date of Birth:</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <br>

        <!-- Terms -->
        <div>
            <input
                type="checkbox"
                id="terms"
                name="terms"
                required
            >
            <label for="terms">
                I agree to the terms and conditions.
            </label>
        </div>

        <br>

        <!-- Submit -->
        <button type="submit">Register</button>

        <!-- Reset -->
        <button type="reset">Reset</button>

    </form>

</body>
</html>
